# Publica la demo web en GitHub Pages en cada push a main.
#
# Antes de publicar pasa la suite y el typecheck: una demo rota delante de alguien es
# peor que no tener demo. La demo vive bajo /gestor_empleados/, de ahí DEMO_BASE_URL
# (ver app.config.js).
name: Demo web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest --runInBand
      - name: Construir la demo
        run: npm run demo:build
        env:
          DEMO_BASE_URL: /gestor_empleados
      - name: Recarga en rutas internas
        # Pages no sabe de rutas de la app: al recargar /gestor_empleados/empleados
        # devolvería 404. Con 404.html igual al índice, la app arranca y se enruta sola.
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
